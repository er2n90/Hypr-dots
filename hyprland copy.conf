autogenerated = 0

$mainMod = SUPER

$terminal = kitty

$fileManager = thunar

$menu = hyprlauncher

# KEYBINDS

bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, F, fullscreen, 0
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, alterzorder, raise
# =============================================================================
#  HYPRLAND CONFIGURATION - BATTERY MAX EDITION
# =============================================================================

# --- Monitors ----------------------------------------------------------------
monitor=,highrr,auto,1
monitor = eDP-1, disable
# --- Autostart ---------------------------------------------------------------
# Feather-light wallpaper loading (using swww without heavy animations)
exec-once = swww init || hyprpaper
exec-once = swww img ~/Pictures/wallpapers/wallpaperflare.com_wallpaper.jpg
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = waybar

# --- Input Config ------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = -0.5

    accel_profile = flat # no mouse accel

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- General (Minimal & Clean) -----------------------------------------------
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2

    # Static colors - no dynamic border animations looping in the background
    col.active_border = rgba(ffffffaa) rgba(333333aa) 45deg
    col.inactive_border = rgba(1a1a1acc)

    layout = dwindle
    allow_tearing = false
}

# --- Decoration (Optimized for Battery) -------------------------------------
decoration {
    rounding = 8

    # Opaque windows keep the GPU from doing alpha-blending calculations
    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    # DISABLING SHADOWS AND BLUR SAVES SEVERAL WATTS OF DISCHARGE RATE
    shadow {
        enabled = false
    }

    blur {
        enabled = true    # Blur is a major GPU battery drain on laptops
    }
}

# --- Animations (Fast, Snappy, Minimal Ticks) -------------------------------
animations {
  enabled = true
    # Clean linear and fast curves to ensure the CPU/GPU stops ticking quickly
    bezier = fastEase, 0.25, 1, 0.5, 1

    # Snappy animations over a very short duration (less frames rendered = less power)
    animation = windows, 1, 3, fastEase, slide
    animation = windowsIn, 1, 3, fastEase, slide
    animation = windowsOut, 1, 3, fastEase, slide
    animation = fade, 1, 3, fastEase
    animation = workspaces, 1, 3.5, fastEase, slide

    # Strictly disabled to prevent continuous idle power consumption
    animation = borderangle, 0
}


